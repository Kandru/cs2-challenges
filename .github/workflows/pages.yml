name: Deploy Challenge Builder

on:
  push:
    branches:
      - main
    paths:
      - 'builder/**'
      - 'src/Challenges/extractors/**'
      - 'src/Challenges/utils/EventData.cs'
      - 'src/Challenges/classes/ChallengeEngine.cs'
      - 'src/Challenges/classes/ChallengeEngine.Actions.cs'
      - 'tools/generate_catalog.py'
      - 'tools/catalog_weapons.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate catalog
        run: make catalog

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload builder artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
