name: Wiki redirect

# One-shot: replace wiki content with a Home page that points at GitHub Pages.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-wiki-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Publish wiki Home redirect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wiki_dir="$RUNNER_TEMP/wiki"
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone --depth 1 "$wiki_url" "$wiki_dir"; then
            echo "::error::Could not clone the wiki. Enable it and create one page in the GitHub UI, then re-run."
            exit 1
          fi

          find "$wiki_dir" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cat > "$wiki_dir/Home.md" <<'EOF'
          # Challenges Documentation

          Documentation has moved to:

          **[https://kandru.github.io/cs2-challenges/](https://kandru.github.io/cs2-challenges/)**

          - [Tutorial](https://kandru.github.io/cs2-challenges/docs/tutorial/)
          - [Challenge builder](https://kandru.github.io/cs2-challenges/builder/)
          - [Reference](https://kandru.github.io/cs2-challenges/docs/reference/challenges/)
          EOF

          cat > "$wiki_dir/_Sidebar.md" <<'EOF'
          - [Home](Home)
          - [Documentation site](https://kandru.github.io/cs2-challenges/)
          EOF

          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Point wiki at documentation site"
          git push origin HEAD:master
