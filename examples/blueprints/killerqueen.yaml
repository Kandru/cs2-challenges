title:
  en: Do the Killerqueen
  de: Die Killerqueen machen
tasks:
  - id: easy
    title:
      en: "{count}/{total} deaths while throwing a grenade"
      de: "{count}/{total} Tode beim Werfen einer Granate"
    type: player_death
    amount: 3
    rules:
      - key: global.iswarmup
        operator: bool==
        value: "false"
      - key: global.isduringround
        operator: bool==
        value: "true"
      - key: victim.grenade.throwing
        operator: "!="
        value: ""
      - key: attacker.isbot
        operator: bool==
        value: "false"
    requires: []
