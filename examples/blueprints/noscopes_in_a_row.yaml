title:
  en: Noscopes in a row
  de: Noscopes hintereinander
tasks:
  - id: easy
    title:
      en: '{count}/{total} Noscopes in a row'
      de: '{count}/{total} Noscopes hintereinander'
    type: player_kill
    amount: 5
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: noscope
        operator: bool==
        value: 'true'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - easy_noscope
  - id: easy_noscope
    title:
      en: 'Rule broken: without scope'
      de: 'Regel verletzt: ohne Scope'
    type: player_kill
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: noscope
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - easy
      - type: task.reset_progress
        values:
          - easy
      - type: task.reset_completed
        values:
          - easy_noscope
  - id: hard
    title:
      en: '{count}/{total} Noscopes in a row'
      de: '{count}/{total} Noscopes hintereinander'
    type: player_kill
    amount: 10
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '25'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: noscope
        operator: bool==
        value: 'true'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - hard_noscope
      - type: task.mark_completed
        values:
          - hard_donotdie
    requires:
      - easy
  - id: hard_noscope
    title:
      en: 'Rule broken: without Scope'
      de: 'Regel verletzt: ohne Scope'
    type: player_kill
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: noscope
        operator: bool==
        value: 'false'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - hard
      - type: task.reset_progress
        values:
          - hard
      - type: task.reset_completed
        values:
          - hard_noscope
    requires:
      - easy
  - id: hard_donotdie
    title:
      en: 'Rule broken: do not die'
      de: 'Regel verletzt: ohne sterben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - hard
      - type: task.reset_progress
        values:
          - hard
      - type: task.reset_completed
        values:
          - hard_donotdie
    requires:
      - easy
