title:
  en: Planted bomb as CT
  de: Bombe als CT gelegt
tasks:
  - id: easy
    title:
      en: "{count}/{total} bombs planted as CT"
      de: "{count}/{total} Bomben als CT gelegt"
    type: player_bomb_planted
    amount: 1
    rules:
      - key: global.iswarmup
        operator: bool==
        value: "false"
      - key: global.isduringround
        operator: bool==
        value: "true"
      - key: planter.team
        operator: ==
        value: CounterTerrorist
      - key: planter.isbot
        operator: bool==
        value: "false"
    requires: []
