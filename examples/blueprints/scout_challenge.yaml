title:
  en: scout paradise
  de: Scout-Paradies
tasks:
  - id: easy
    title:
      en: scout paradise ({count}/{total})
      de: Scout-Paradies ({count}/{total})
    type: player_kill
    amount: 10
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: ssg08
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
  - id: medium
    title:
      en: '{count}/{total} scout without resistance :D'
      de: '{count}/{total} Scouten ohne Gegenwehr :D'
    type: player_kill
    amount: 15
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '30'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: ssg08
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - medium_noscoutdeath
    requires:
      - easy
  - id: medium_noscoutdeath
    title:
      en: 'Rule broken: you died because of a scout'
      de: 'Regel gebrochen: Du bist wegen einer Scout gestorben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: ssg08
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - medium
      - type: task.reset_progress
        values:
          - medium
      - type: task.reset_completed
        values:
          - medium_noscoutdeath
    requires:
      - easy
  - id: hard
    title:
      en: Master of the Scout <3 ({count}/{total})
      de: Meister der Scout <3 ({count}/{total})
    type: player_kill
    amount: 30
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '60'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: ssg08
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - hard_notscoutdeath
    requires:
      - medium
  - id: hard_notscoutdeath
    title:
      en: 'Rule broken: you died because of a scout'
      de: 'Regel gebrochen: Du bist wegen einer Scout gestorben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: ssg08
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - hard
      - type: task.reset_progress
        values:
          - hard
      - type: task.reset_completed
        values:
          - hard_notscoutdeath
    requires:
      - medium
