title:
  en: blind enemies
  de: blinde Gegner
tasks:
  - id: easy
    title:
      en: '{count}/{total} blind enemies'
      de: '{count}/{total} blinde Gegner'
    type: player_has_blinded
    amount: 5
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: isteamflash
        operator: bool==
        value: 'false'
      - key: isselfflash
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
  - id: medium
    title:
      en: '{count}/{total} blind enemies (>1s)'
      de: '{count}/{total} blinde Gegner (>1s)'
    type: player_has_blinded
    amount: 15
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '30'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: isteamflash
        operator: bool==
        value: 'false'
      - key: isselfflash
        operator: bool==
        value: 'false'
      - key: blindduration
        operator: '>='
        value: '1'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - medium_noselfflash
      - type: task.mark_completed
        values:
          - medium_noteamflash
    requires:
      - easy
  - id: medium_noselfflash
    title:
      en: 'Rule broken: do not flash yourself (>2s)!'
      de: 'Regel verletzt: selbst geblendet! (>2s)'
    type: player_got_blinded
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: isselfflash
        operator: bool==
        value: 'true'
      - key: blindduration
        operator: '>='
        value: '2'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - medium
      - type: task.reset_progress
        values:
          - medium
      - type: task.reset_completed
        values:
          - medium_noselfflash
    requires:
      - easy
  - id: medium_noteamflash
    title:
      en: 'Rule broken: do not flash your team (>2s)!'
      de: 'Regel verletzt: Teammitglied geblendet (>2s)!'
    type: player_has_blinded
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: isteamflash
        operator: bool==
        value: 'true'
      - key: isselfflash
        operator: bool==
        value: 'false'
      - key: blindduration
        operator: '>='
        value: '2'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - medium
      - type: task.reset_progress
        values:
          - medium
      - type: task.reset_completed
        values:
          - medium_noteamflash
    requires:
      - easy
