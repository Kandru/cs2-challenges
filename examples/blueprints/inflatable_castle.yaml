title:
  en: times jumped
  de: mal gesprungen
tasks:
  - id: easy
    title:
      en: '{count}/{total} times jumped'
      de: '{count}/{total} mal gesprungen'
    type: player_jump
    amount: 100
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
  - id: medium
    title:
      en: '{count}/{total} times jumped'
      de: '{count}/{total} mal gesprungen'
    type: player_jump
    amount: 500
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '25'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
    requires:
      - easy
  - id: hard
    title:
      en: '{count}/{total} times jumped'
      de: '{count}/{total} mal gesprungen'
    type: player_jump
    amount: 1000
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '50'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
    requires:
      - medium
