title:
  en: Site take
  de: Site einnehmen
tasks:
  - id: easy
    title:
      en: '{count}/{total} bombs planted'
      de: '{count}/{total} Bomben gelegt'
    type: player_bomb_planted
    amount: 3
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
    requires: []
