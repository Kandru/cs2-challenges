title:
  en: Bhop clips
  de: Bhop-Clips
tasks:
  - id: medium
    title:
      en: '{count}/{total} airborne kills'
      de: '{count}/{total} Kills in der Luft'
    type: player_kill
    amount: 5
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '25'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: attackerinair
        operator: bool==
        value: 'true'
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    requires: []
