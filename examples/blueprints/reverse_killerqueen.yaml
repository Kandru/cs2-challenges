title:
  en: Reverse Killerqueen
  de: Umgekehrte Killerqueen
tasks:
  - id: easy
    title:
      en: "{count}/{total} kills on a grenade thrower"
      de: "{count}/{total} Kills gegen Granatenwerfer"
    type: player_kill
    amount: 3
    rules:
      - key: global.iswarmup
        operator: bool==
        value: "false"
      - key: global.isduringround
        operator: bool==
        value: "true"
      - key: victim.grenade.throwing
        operator: "!="
        value: ""
      - key: isteamkill
        operator: bool==
        value: "false"
      - key: isselfkill
        operator: bool==
        value: "false"
      - key: victim.isbot
        operator: bool==
        value: "false"
    requires: []
