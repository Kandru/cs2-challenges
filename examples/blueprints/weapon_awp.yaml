title:
  en: AWP kills
  de: AWP Kills
tasks:
  - id: buy_first
    title:
      en: Buy a awp
      de: Kaufe eine awp
    type: item_purchase
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: awp
    actions:
      - type: task.mark_completed
        values:
          - pick_up_first
  - id: pick_up_first
    title:
      en: Pick up a awp
      de: Hebe eine awp auf
    type: item_pickup
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: item
        operator: contains
        value: awp
    actions:
      - type: task.mark_completed
        values:
          - buy_first
  - id: easy
    title:
      en: '{count}/{total} AWP kills'
      de: '{count}/{total} AWP Kills'
    type: player_kill
    amount: 15
    cooldown: 0
    announce_progress: false
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: awp
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    requires:
      - buy_first
      - pick_up_first
  - id: medium
    title:
      en: '{count}/{total} AWP without resistance'
      de: '{count}/{total} AWP ohne Gegenwehr'
    type: player_kill
    amount: 15
    cooldown: 0
    announce_progress: false
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '30'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: awp
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - medium_noawpdeath
    requires:
      - easy
  - id: medium_noawpdeath
    title:
      en: 'Rule broken: you died because of a AWP'
      de: 'Regel gebrochen: Du bist wegen einer AWP gestorben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: awp
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - medium
      - type: task.reset_progress
        values:
          - medium
      - type: task.reset_completed
        values:
          - medium_noawpdeath
    requires:
      - easy
  - id: hard
    title:
      en: Master of the AWP <3 ({count}/{total})
      de: Meister der AWP <3 ({count}/{total})
    type: player_kill
    amount: 30
    cooldown: 0
    announce_progress: false
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '15'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: awp
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - hard_noawpdeath
    requires:
      - medium
  - id: hard_noawpdeath
    title:
      en: 'Rule broken: you died because of a AWP'
      de: 'Regel gebrochen: Du bist wegen einer AWP gestorben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: awp
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - hard
      - type: task.reset_progress
        values:
          - hard
      - type: task.reset_completed
        values:
          - hard_noawpdeath
    requires:
      - medium
