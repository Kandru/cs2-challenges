title:
  en: Headshots in a row
  de: Kopfschüsse hintereinander
tasks:
  - id: easy
    title:
      en: '{count}/{total} Headshots in a row'
      de: '{count}/{total} Kopfschüsse hintereinander'
    type: player_kill
    amount: 3
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: headshot
        operator: bool==
        value: 'true'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - easy_noheadshot
  - id: easy_noheadshot
    title:
      en: 'Rule broken: without headshot'
      de: 'Regel verletzt: ohne Headshot'
    type: player_kill
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: headshot
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - easy
      - type: task.reset_progress
        values:
          - easy
      - type: task.reset_completed
        values:
          - easy_noheadshot
  - id: medium
    title:
      en: '{count}/{total} Headshots in a row'
      de: '{count}/{total} Kopfschüsse hintereinander'
    type: player_kill
    amount: 10
    cooldown: 0
    announce_progress: true
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '20'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: headshot
        operator: bool==
        value: 'true'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - medium_noheadshot
    requires:
      - easy
  - id: medium_noheadshot
    title:
      en: 'Rule broken: without headshot'
      de: 'Regel verletzt: ohne Headshot'
    type: player_kill
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
