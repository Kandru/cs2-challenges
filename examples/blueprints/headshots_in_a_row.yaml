      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: headshot
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - medium
      - type: task.reset_progress
        values:
          - medium
      - type: task.reset_completed
        values:
          - medium_noheadshot
    requires:
      - easy
