title:
  en: Blind Kill
  de: Blinder Kill
tasks:
  - id: hard
    title:
      en: "{count}/{total} kills while blind"
      de: "{count}/{total} Kills während geblendet"
    type: player_kill
    amount: 3
    rules:
      - key: global.iswarmup
        operator: bool==
        value: "false"
      - key: global.isduringround
        operator: bool==
        value: "true"
      - key: attackerblind
        operator: bool==
        value: "true"
      - key: isteamkill
        operator: bool==
        value: "false"
      - key: isselfkill
        operator: bool==
        value: "false"
      - key: victim.isbot
        operator: bool==
        value: "false"
    requires: []
