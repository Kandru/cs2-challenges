title:
  en: SCAR20 kills
  de: SCAR20 Kills
tasks:
  - id: buy_first
    title:
      en: Buy a scar20
      de: Kaufe eine scar20
    type: item_purchase
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: scar20
    actions:
      - type: task.mark_completed
        values:
          - pick_up_first
  - id: pick_up_first
    title:
      en: Pick up a scar20
      de: Hebe eine scar20 auf
    type: item_pickup
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: item
        operator: contains
        value: scar20
    actions:
      - type: task.mark_completed
        values:
          - buy_first
  - id: easy
    title:
      en: '{count}/{total} SCAR20 kills'
      de: '{count}/{total} SCAR20 Kills'
    type: player_kill
    amount: 15
    cooldown: 0
    announce_progress: false
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '10'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: scar20
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    requires:
      - buy_first
      - pick_up_first
  - id: medium
    title:
      en: '{count}/{total} SCAR20 without resistance'
      de: '{count}/{total} SCAR20 ohne Gegenwehr'
    type: player_kill
    amount: 15
    cooldown: 0
    announce_progress: false
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '30'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: scar20
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - medium_noscar20death
    requires:
      - easy
  - id: medium_noscar20death
    title:
      en: 'Rule broken: you died because of a SCAR20'
      de: 'Regel gebrochen: Du bist wegen einer SCAR20 gestorben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: scar20
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - medium
      - type: task.reset_progress
        values:
          - medium
      - type: task.reset_completed
        values:
          - medium_noscar20death
    requires:
      - easy
  - id: hard
    title:
      en: Master of the SCAR20 <3 ({count}/{total})
      de: Meister der SCAR20 <3 ({count}/{total})
    type: player_kill
    amount: 30
    cooldown: 0
    announce_progress: false
    announce_completion: true
    data:
      PlayerSessions:
        setpoints: '15'
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: scar20
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - hard_noscar20death
    requires:
      - medium
  - id: hard_noscar20death
    title:
      en: 'Rule broken: you died because of a SCAR20'
      de: 'Regel gebrochen: Du bist wegen einer SCAR20 gestorben'
    type: player_death
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: weapon
        operator: contains
        value: scar20
      - key: attacker.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - hard
      - type: task.reset_progress
        values:
          - hard
      - type: task.reset_completed
        values:
          - hard_noscar20death
    requires:
      - medium
