title:
  en: Untouchable
  de: Unberührbar
tasks:
  - id: easy
    title:
      en: '{count}/{total} kills in a row without taking damage'
      de: '{count}/{total} Kills in Folge ohne Schaden zu nehmen'
    type: player_kill
    amount: 3
    cooldown: 0
    announce_progress: true
    announce_completion: true
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
      - key: isselfkill
        operator: bool==
        value: 'false'
      - key: isteamkill
        operator: bool==
        value: 'false'
      - key: victim.isbot
        operator: bool==
        value: 'false'
    actions:
      - type: task.mark_completed
        values:
          - easy_gothit
    requires: []
  - id: easy_gothit
    title:
      en: 'Rule broken: took damage'
      de: 'Regel verletzt: Schaden genommen'
    type: player_hurt_victim
    amount: 1
    cooldown: 0
    visible: false
    announce_progress: false
    announce_completion: false
    rules:
      - key: global.iswarmup
        operator: bool==
        value: 'false'
      - key: global.isduringround
        operator: bool==
        value: 'true'
    actions:
      - type: notify.player.progress.rule_broken
        values:
          - easy
      - type: task.reset_progress
        values:
          - easy
      - type: task.reset_completed
        values:
          - easy_gothit
    requires: []
  - id: medium
