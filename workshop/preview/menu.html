<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Menu preview</title>
<link rel="stylesheet" href="kit.css" />
</head>
<body>
<div class="stage">
  <div id="Menu" class="MenuRoot ph-fs ph-card">
    <div class="ph-bg"></div>
    <div class="ph-bar"></div>
    <div class="MenuContent">
      <div class="ph-titlebar">
        <span class="ph-title">Challenges</span>
        <button class="ph-icon-btn"><span class="ph-close-x ph-close-x-a"></span><span class="ph-close-x ph-close-x-b"></span></button>
      </div>
      <div class="MenuBody">
        <div class="MenuList">
          <div class="MenuFilterBar">
            <button class="MenuFilterBtn"><span class="MenuFilterLabel">All</span></button>
            <button class="MenuFilterBtn active"><span class="MenuFilterLabel">Progress</span></button>
            <button class="MenuFilterBtn"><span class="MenuFilterLabel">Ending soon</span></button>
            <button class="MenuFilterBtn"><span class="MenuFilterLabel">Starting soon</span></button>
          </div>
          <div class="MenuRows">
          <div class="ph-stat MenuRow"><div class="ph-stat-lab"><span class="ph-stat-name">Headshots in a row</span><span class="ph-stat-val">30%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p30"></div></div></div>
          <div class="ph-stat MenuRow"><div class="ph-stat-lab"><span class="ph-stat-name">Knife without resistance</span><span class="ph-stat-val">20%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p20"></div></div></div>
          <div class="ph-stat MenuRow"><div class="ph-stat-lab"><span class="ph-stat-name">Sharp and Deadly</span><span class="ph-stat-val">40%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p40"></div></div></div>
          <div class="ph-stat MenuRow"><div class="ph-stat-lab"><span class="ph-stat-name">AWP Master</span><span class="ph-stat-val">0%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p0"></div></div></div>
          <div class="ph-stat MenuRow"><div class="ph-stat-lab"><span class="ph-stat-name">Weapon: AK-47</span><span class="ph-stat-val">70%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p70"></div></div></div>
          <div class="ph-stat MenuRow empty"><div class="ph-stat-lab"><span class="ph-stat-name"></span><span class="ph-stat-val"></span></div><div class="ph-stat-track"><div class="ph-stat-fill p0"></div></div></div>
          <div class="ph-stat MenuRow empty"><div class="ph-stat-lab"><span class="ph-stat-name"></span><span class="ph-stat-val"></span></div><div class="ph-stat-track"><div class="ph-stat-fill p0"></div></div></div>
          <div class="ph-stat MenuRow empty"><div class="ph-stat-lab"><span class="ph-stat-name"></span><span class="ph-stat-val"></span></div><div class="ph-stat-track"><div class="ph-stat-fill p0"></div></div></div>
          <div class="ph-stat MenuRow empty is-off"></div>
          <div class="ph-stat MenuRow empty is-off"></div>
          </div>
          <div class="MenuFooter">
            <button class="MenuFooterBtn">&lt;</button><span class="MenuPage">1 / 1</span><button class="MenuFooterBtn">&gt;</button>
          </div>
        </div>
        <div class="MenuScore">
          <span class="ScoreTitle">Scoreboard</span>
          <div class="ScoreRow ScorePinned is-self"><span class="ScoreRank">#1</span><span class="ScoreName">Kalle</span><span class="ScoreVal">5</span></div>
          <div class="MenuRows">
          <div class="ScoreRow is-self"><span class="ScoreName">Kalle</span><span class="ScoreVal">5</span></div>
          <div class="ScoreRow"><span class="ScoreName">Alice</span><span class="ScoreVal">3</span></div>
          <div class="ScoreRow"><span class="ScoreName">Bob</span><span class="ScoreVal">2</span></div>
          <div class="ScoreRow"><span class="ScoreName">Carol</span><span class="ScoreVal">1</span></div>
          <div class="ScoreRow empty"><span class="ScoreName">.</span><span class="ScoreVal">.</span></div>
          <div class="ScoreRow empty"><span class="ScoreName">.</span><span class="ScoreVal">.</span></div>
          <div class="ScoreRow empty"><span class="ScoreName">.</span><span class="ScoreVal">.</span></div>
          <div class="ScoreRow empty"><span class="ScoreName">.</span><span class="ScoreVal">.</span></div>
          </div>
          <div class="MenuFooter">
            <button class="MenuFooterBtn">&lt;</button><span class="MenuPage">1 / 1</span><button class="MenuFooterBtn">&gt;</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
