<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tracker preview</title>
<link rel="stylesheet" href="kit.css" />
</head>
<body>
<div class="stage">
  <div id="Tracker" class="Tracker ph-card">
    <div class="ph-bg"></div>
    <div class="ph-bar"></div>
    <div class="TrackerContent">
      <div class="ph-titlebar"><span class="ph-title">Challenges</span><span class="ph-money TrackerCount">2 / 12</span></div>
      <div class="TrackerBody">
        <div class="ph-stat TrackerRow"><div class="ph-stat-lab"><span class="ph-stat-name">Headshots in a row</span><span class="ph-stat-val">30%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p30"></div></div></div>
        <div class="ph-stat TrackerRow"><div class="ph-stat-lab"><span class="ph-stat-name">Knife without resistance</span><span class="ph-stat-val">20%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p20"></div></div></div>
        <div class="ph-stat TrackerRow"><div class="ph-stat-lab"><span class="ph-stat-name">Sharp and Deadly</span><span class="ph-stat-val">40%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p40"></div></div></div>
        <div class="ph-stat TrackerRow"><div class="ph-stat-lab"><span class="ph-stat-name">AWP Master</span><span class="ph-stat-val">0%</span></div><div class="ph-stat-track"><div class="ph-stat-fill p0"></div></div></div>
        <div class="ph-stat TrackerRow is-off"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
